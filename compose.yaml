name: ngob-gae-dev-2569

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.local
    ports:
      - "127.0.0.1:4317:4317"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:4317/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    restart: "no"
